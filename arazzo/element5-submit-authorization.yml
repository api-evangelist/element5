arazzo: 1.0.1
info:
  title: Element5 — Upload document and submit authorization
  version: 1.0.0
  description: Upload a supporting file object, submit a prior-authorization request, then poll status.
  x-realizes-capability-ids:
  - BC-2800.30
  x-capability-derivation:
    method: 'deterministic join: sourceDescriptions -> per-tag OpenAPI -> tag/capability edge. No classification at this step.'
    min_confidence: 0.7
    sources:
    - capability_id: BC-2800.30
      capability_name: Eligibility & Benefits Verification
      spec: element5-authorization-api-openapi.yml
      confidence: 0.75
    model: Turbo EA Capabilities by Vincent Verdet — Turbo EA, https://github.com/vincentmakes/turbo-ea-capabilities, CC BY 4.0
sourceDescriptions:
- name: authorizationApi
  url: ../openapi/element5-authorization-api-openapi.yml
  type: openapi
- name: objectStoreApi
  url: ../openapi/element5-object-store-api-openapi.yml
  type: openapi
workflows:
- workflowId: submitAuthorization
  summary: Upload a document, submit an authorization request, and poll to completion.
  inputs:
    type: object
    properties:
      apiKey:
        type: string
      file:
        type: string
      payload:
        type: object
  steps:
  - stepId: uploadDocument
    operationId: uploadFileObject
    requestBody:
      payload: $inputs.file
    outputs:
      objectId: $response.body#/objectId
  - stepId: submit
    operationId: submitAuthorizationRequest
    requestBody:
      payload: $inputs.payload
    outputs:
      taskId: $response.body#/taskId
  - stepId: checkStatus
    operationId: getSubmitAuthorizationRequestStatus
    parameters:
    - name: task-id
      in: path
      value: $steps.submit.outputs.taskId
    outputs:
      status: $response.body#/status
  outputs:
    status: $steps.checkStatus.outputs.status
