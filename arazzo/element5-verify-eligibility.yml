arazzo: 1.0.1
info:
  title: Element5 — Verify eligibility and await result
  version: 1.0.0
  description: Submit an eligibility request and poll until the task succeeds or fails.
  x-realizes-capability-ids:
  - BC-2800.30
  x-capability-derivation:
    method: 'deterministic join: sourceDescriptions -> per-tag OpenAPI -> tag/capability edge. No classification at this step.'
    min_confidence: 0.7
    sources:
    - capability_id: BC-2800.30
      capability_name: Eligibility & Benefits Verification
      spec: element5-eligibility-api-openapi.yml
      confidence: 0.92
    model: Turbo EA Capabilities by Vincent Verdet — Turbo EA, https://github.com/vincentmakes/turbo-ea-capabilities, CC BY 4.0
sourceDescriptions:
- name: eligibilityApi
  url: ../openapi/element5-eligibility-api-openapi.yml
  type: openapi
workflows:
- workflowId: verifyEligibility
  summary: Submit an eligibility request, then poll its task status to completion.
  inputs:
    type: object
    properties:
      apiKey:
        type: string
      payload:
        type: object
  steps:
  - stepId: submit
    operationId: submitEligibilityRequest
    requestBody:
      payload: $inputs.payload
    outputs:
      taskId: $response.body#/taskId
  - stepId: checkStatus
    operationId: getSubmitEligibilityRequestStatus
    parameters:
    - name: task-id
      in: path
      value: $steps.submit.outputs.taskId
    outputs:
      status: $response.body#/status
  outputs:
    status: $steps.checkStatus.outputs.status
