        uhcTaxIdNumber:
          type: string
          description: TaxID loaded in the gateway for the given records location - UHC
        uhcCorporateTaxOwnerId:
          type: string
          description: Corporate Tax Owner ID loaded in the gateway for the given records location - UHC
        uhcPortalCareProvider:
          type: string
          description: Care Provider loaded in the gateway for the given records location - UHC
      required: []
    TaskFailed_EdiExchange:
      type: object
