        taskId:
          $ref: '#/components/schemas/TaskID'
        taskName:
          $ref: '#/components/schemas/TaskName_ProcessX12EligibilityTransaction'
        createdAt:
          $ref: '#/components/schemas/DateString'
        status:
          $ref: '#/components/schemas/TaskStatus_Failed'
        startedAt:
          $ref: '#/components/schemas/DateString'
        endedAt:
          $ref: '#/components/schemas/DateString'
        attempt:
          minimum: 1
          type: integer
        taskPayload:
          type: object
          properties:
            response:
              type: object
              properties:
                failureReason:
                  type: string
    ProcessX12EligibilityTransactionAttachment271:
      type: object
      description: X12 271 file
      required:
      - uri
      properties:
        uri:
          type: string
          description: HTTPS object store URI or data URI for the eligibility response (271) file.
          oneOf:
          - pattern: ^https://(blob|blob-[a-zA-z]*)\.e5\.ai/file-object/[a-zA-Z0-9-].*$
            description: Must be an HTTPS link from blob.e5.ai or blob-qa.e5.ai
          - pattern: ^data:application/edi-x12;base64,[a-zA-Z0-9+/]*={0,2}$
            description: Base64 encoded EDI Data URI X12
          - pattern: ^data:(application/gzip|application/x-gzip|application/edi-x12\+gzip);base64,[a-zA-Z0-9+/]*={0,2}$
            description: Base64 encoded Gzipped EDI Data URI
        interchangeDate:
          type: string
          format: date
          description: Date of response. ISO 8601 date.
        interchangeTime:
          type: string
          description: Time of response. ISO 8601 time.
        interchangeTimezone:
          type: string
          description: Timezone of response time. Mandatory when interchangeDate is provided.
    TaskRestarted_Eligibility:
      type: object
      title: TaskRestarted
      properties:
        taskId:
          $ref: '#/components/schemas/TaskID'
        taskName:
          $ref: '#/components/schemas/TaskName_Eligibility'
        createdAt:
          $ref: '#/components/schemas/DateString'
        status:
          $ref: '#/components/schemas/TaskStatus_Processing'
        startedAt:
          $ref: '#/components/schemas/DateString'
        attempt:
          minimum: 1
          type: integer
    TaskStatus_Success:
      type: string
      enum:
      - success
    WaystarGateway:
      type: object
      properties:
        gatewayName:
          type: string
          enum:
          - Waystar
          description: Clearinghouse/Payor to check eligibility
        waystarSenderId:
          type: string
          description: Waystar Sender ID assigned to the client - Required for Waystar
        waystarProviderName:
          type: string
          description: Waystar associated provider name assigned to the location servicing the patient - Required for Waystar
      required: []
    TaskID:
      type: string
      format: uuid
      example: 55dfe5e9-725a-4ce0-ba41-925e588623c2
    TaskRequestFailedResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/TaskStatus_Failed'
        reason:
          type: string
      description: Task Request has failed
